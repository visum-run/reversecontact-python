[project]
name = "reversecontact"
version = "0.1.4"
description = "Official Python SDK for the Reverse Contact API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Reverse Contact", email = "support@reversecontact.com" }]
keywords = ["reverse contact", "enrichment", "b2b data", "people search", "company data", "email finder", "sdk", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://docs.reversecontact.com/docs/sdk/python"
Documentation = "https://docs.reversecontact.com/docs/sdk/python"
Repository = "https://github.com/visum-run/reversecontact-python"
Issues = "https://github.com/visum-run/reversecontact-python/issues"
Changelog = "https://github.com/visum-run/reversecontact-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
  "datamodel-code-generator[http]>=0.26",
  "hatchling>=1.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reversecontact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["reversecontact"]
mypy_path = "src"
